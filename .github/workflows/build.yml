name: PCSMNext CI/CD

# ============================================================
# PCSMNext 自动构建工作流
# 项目: .NET 10 WPF 桌面应用
# 框架: net10.0-windows7.0 / net10.0
# 解决方案格式: .slnx (需要 .NET 10 SDK)
# ============================================================

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
  SOLUTION_PATH: 'PCSMNext.slnx'

jobs:
  # ============================================================
  # 构建 Job
  # ============================================================
  build:
    name: 构建 PCSMNext
    runs-on: windows-latest

    # 所有 run 步骤的默认工作目录
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      # ----------------------------------------------------------
      # Step 1: 检出代码
      # ----------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: PCSMNext

      # ----------------------------------------------------------
      # Step 2: 安装 .NET 10 SDK
      # .NET 10 是 .slnx 解决方案格式的最低要求
      # ----------------------------------------------------------
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ----------------------------------------------------------
      # Step 3: 验证环境
      # ----------------------------------------------------------
      - name: 显示 .NET 版本信息
        run: |
          dotnet --version
          dotnet --list-sdks

      # ----------------------------------------------------------
      # Step 4: 克隆 LivelyAnimationEngine 依赖仓库
      # PCSMNext.slnx 引用了 LivelyAnimationEngine/LivelyAnimationEngine.csproj
      # 必须在 restore 之前克隆，否则 MSBuild 解析 .slnx 时会报 MSB1009
      # ----------------------------------------------------------
      - name: 克隆 LivelyAnimationEngine
        working-directory: ${{ github.workspace }}/PCSMNext
        run: |
          git clone https://github.com/ksayus/LivelyAnimationEngine.git
          echo "=== 验证 LAE 已克隆 ==="
          dir LivelyAnimationEngine\LAE\LivelyAnimationEngine.csproj

      # ----------------------------------------------------------
      # Step 5: 验证文件结构
      # ----------------------------------------------------------
      - name: 验证项目文件
        working-directory: ${{ github.workspace }}/PCSMNext
        run: |
          echo "=== 验证 .slnx 文件 ==="
          dir PCSMNext.slnx
          echo "=== 验证项目目录 ==="
          dir PCSMNext.App\PCSMNext.App.csproj
          dir PCSMNext.Core\PCSMNext.Core.csproj
          dir PCSMNext.Services\PCSMNext.Services.csproj
          dir LivelyAnimationEngine\LAE\LivelyAnimationEngine.csproj

      # ----------------------------------------------------------
      # Step 6: 还原依赖
      # 注意: .slnx 中引用的 LivelyAnimationEngine/LivelyAnimationEngine.csproj
      # 实际路径是 LivelyAnimationEngine/LAE/LivelyAnimationEngine.csproj
      # 如果 .slnx 路径不匹配，MSBuild 会报 MSB1009 错误
      # 此时回退到逐个项目 restore
      # ----------------------------------------------------------
      - name: 还原 NuGet 包
        working-directory: ${{ github.workspace }}/PCSMNext
        run: |
          dotnet restore PCSMNext.slnx
        continue-on-error: true

      # 如果 .slnx restore 失败，回退到逐个项目 restore
      - name: 还原 NuGet 包 (逐个项目)
        working-directory: ${{ github.workspace }}/PCSMNext
        if: failure()
        run: |
          echo "=== .slnx restore 失败，回退到逐个项目 restore ==="
          dotnet restore PCSMNext.Core/PCSMNext.Core.csproj
          dotnet restore PCSMNext.Services/PCSMNext.Services.csproj
          dotnet restore LivelyAnimationEngine/LAE/LivelyAnimationEngine.csproj
          dotnet restore PCSMNext.App/PCSMNext.App.csproj

      # ----------------------------------------------------------
      # Step 7: 构建项目
      # ----------------------------------------------------------
      - name: 构建项目
        working-directory: ${{ github.workspace }}/PCSMNext
        run: >
          dotnet build PCSMNext.slnx
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      # 如果 .slnx build 失败，回退到逐个项目 build
      - name: 构建项目 (逐个项目)
        working-directory: ${{ github.workspace }}/PCSMNext
        if: failure()
        run: |
          echo "=== .slnx build 失败，回退到逐个项目 build ==="
          dotnet build PCSMNext.Core/PCSMNext.Core.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build PCSMNext.Services/PCSMNext.Services.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build LivelyAnimationEngine/LAE/LivelyAnimationEngine.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build PCSMNext.App/PCSMNext.App.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      # ----------------------------------------------------------
      # Step 8: 发布 App (生成单文件应用)
      # ----------------------------------------------------------
      - name: 发布应用
        working-directory: ${{ github.workspace }}/PCSMNext
        run: >
          dotnet publish PCSMNext.App/PCSMNext.App.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --output ${{ github.workspace }}/publish
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      # ----------------------------------------------------------
      # Step 9: 上传构建产物
      # ----------------------------------------------------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PCSMNext-${{ env.BUILD_CONFIGURATION }}
          path: ${{ github.workspace }}/publish/
          retention-days: 30

  # ============================================================
  # 可选: 创建 Release
  # 仅在推送 tag 时触发，如 v1.0.0
  # ============================================================
  release:
    name: 创建 Release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: PCSMNext-Release
          path: publish/

      - name: 打包为 ZIP
        run: |
          Compress-Archive -Path publish/* -DestinationPath PCSMNext.zip

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PCSMNext.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
